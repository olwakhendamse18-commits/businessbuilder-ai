name: Tests and security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-synthetic-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Parse and lint Python
        run: ruff check --select E9,F63,F7,F82 .
      - name: Audit dependencies
        run: pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Run tests
        run: python -m unittest discover -s tests -v
